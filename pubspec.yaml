name: broget_ai
description: BROGET AI personal nutrition companion for Android and Web.
publish_to: none
version: 1.0.1+2
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_app_check: ^0.4.0
  firebase_analytics: ^12.0.0
  firebase_crashlytics: ^5.0.0
  http: ^1.5.0
  image_picker: ^1.2.0
  image: ^4.5.4
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.0
  connectivity_plus: ^7.0.0
  flutter_timezone: ^5.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/brogetai_full_logo.png
    - assets/branding/brogetai_app_logo_192.png
  fonts:
    - family: BrogetSans
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
